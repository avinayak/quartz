# Shared geometry, window layout, and palette for every application using the
# Quartz theme.
#
# Keep the radius in the range 0 through 64. Colors must be opaque #RRGGBB
# values. Quartz Settings stores user choices in the same format and renders
# them through the same GTK 2, GTK 3, GTK 4, Marco, and panel theme sources.
QUARTZ_BORDER_RADIUS_PX=3
QUARTZ_WINDOW_LAYOUT=cupertino
QUARTZ_MENUBAR_BG=#ffffff
QUARTZ_TITLEBAR_BG=#ffffff
QUARTZ_APPLICATION_BG=#ffffff
